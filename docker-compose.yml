services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financials
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: financials
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financials -d financials"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["python", "-m", "investing_data_engine.migrate"]
    environment:
      FINANCIALS_DATABASE_URL: postgresql://financials:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/financials
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "investing_data_engine.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      FINANCIALS_DATABASE_URL: postgresql://financials:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/financials
      FINANCIALS_DOCUMENT_DIR: /data/documents
      FINANCIALS_SEC_CONTACT_EMAIL: ${SEC_CONTACT_EMAIL:-}
    ports: ["9090:8000"]
    volumes: ["documents:/data/documents:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "investing_data_engine.worker"]
    environment:
      FINANCIALS_DATABASE_URL: postgresql://financials:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/financials
      FINANCIALS_DOCUMENT_DIR: /data/documents
      FINANCIALS_SEC_CONTACT_EMAIL: ${SEC_CONTACT_EMAIL:-}
      FINANCIALS_NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      FINANCIALS_NINEROUTER_BASE_URL: ${FINANCIALS_NINEROUTER_BASE_URL:-https://api.ercloud.site/v1}
      FINANCIALS_NINEROUTER_MODEL: ${FINANCIALS_NINEROUTER_MODEL:-go-free}
    volumes: ["documents:/data/documents"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  postgres-data:
  documents:
