[project]
name = "investing-data-engine"
version = "0.1.0"
description = "Explicit extraction and read-only serving APIs for company financials"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "asyncpg>=0.30,<1",
  "procrastinate[psycopg]>=3.0,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.27,<1",
  "yfinance>=0.2.65,<2",
  "beautifulsoup4>=4.12",
  "lxml>=5",
]

[project.optional-dependencies]
extraction = ["arelle-release>=2.30", "beautifulsoup4>=4.12", "pymupdf>=1.24", "pytesseract>=0.3", "playwright>=1.48"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investing_data_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
